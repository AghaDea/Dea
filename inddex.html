<style>

@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400&display=swap');

:root{
  --bg:#0b0907;
  --bg-elev:#16110c;
  --bg-card:#1c1510;
  --border:#3d2e1f;
  --border-soft:#2a2018;
  --text:#e8dcc8;
  --text-dim:#9a8b72;
  --accent:#c45c26;
  --accent-hover:#a84a1c;
  --accent-dim:#5c2e14;
  --green:#6b8f5e;
  --orange:#d4893a;
  --red:#9b2c2c;
  --gold:#c9a227;
  --purple:#7a5c4a;
  --radius:10px;
  --radius-sm:8px;
  --shadow:0 10px 36px rgba(0,0,0,.55), 0 0 0 1px rgba(201,162,39,.08);
  --leather:#2a1c12;
  --parchment:#e8dcc8;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  margin:0;background:var(--bg);color:var(--text);
  font-family:"EB Garamond",Georgia,"Times New Roman",serif;
  min-height:100vh;display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(ellipse 120% 80% at 50% -20%, rgba(196,92,38,.12), transparent 55%),
    radial-gradient(ellipse 80% 50% at 100% 100%, rgba(155,44,44,.08), transparent 45%),
    linear-gradient(180deg,#0b0907 0%,#100d0a 100%);
}
button,input,textarea{font-family:inherit;}
button{cursor:pointer;}
button:disabled{opacity:.5;cursor:default;pointer-events:none;}
::-webkit-scrollbar{width:6px;}
::-webkit-scrollbar-thumb{background:#4a3a28;border-radius:6px;}
.hidden{display:none !important;}

#app{flex:1;display:flex;flex-direction:column;max-width:520px;margin:0 auto;width:100%;position:relative;}

.auth-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(196,92,38,.1), transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(155,44,44,.07), transparent 45%),
    var(--bg);
}
.auth-card{
  width:100%;max-width:380px;
  background:linear-gradient(165deg,#1c1510 0%,#14100c 100%);
  border:1px solid var(--border);
  border-radius:14px;
  padding:28px 22px 24px;
  box-shadow:0 0 0 1px rgba(201,162,39,.12),0 20px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(232,220,200,.06);
  position:relative;
}
.auth-card::before{
  content:'';position:absolute;inset:8px;border:1px solid rgba(201,162,39,.15);
  border-radius:10px;pointer-events:none;
}
.auth-logo{
  font-family:"Cinzel",Georgia,serif;
  font-size:34px;font-weight:900;text-align:center;margin-bottom:6px;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--parchment);
  text-shadow:0 2px 0 rgba(0,0,0,.4),0 0 24px rgba(196,92,38,.25);
}
.auth-logo span{
  background:linear-gradient(180deg,#e8c547,#c9a227 50%,#8a6e12);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.auth-sub{
  text-align:center;color:var(--text-dim);margin-bottom:22px;
  font-size:15px;font-style:italic;letter-spacing:.02em;
}
.field{margin-bottom:14px;position:relative;z-index:1;}
.field label{
  display:block;font-size:11px;color:var(--gold);margin-bottom:6px;
  font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  font-family:"Cinzel",Georgia,serif;
}
.field input,.field textarea{
  width:100%;background:#0f0c09;
  border:1px solid var(--border);color:var(--text);
  padding:13px 14px;border-radius:8px;font-size:16px;outline:none;
  transition:border-color .2s,box-shadow .2s;
  box-shadow:inset 0 2px 6px rgba(0,0,0,.35);
}
.field input:focus,.field textarea:focus{
  border-color:var(--accent);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.35),0 0 0 2px rgba(196,92,38,.25);
}
.btn{
  width:100%;padding:14px;border-radius:8px;border:none;
  font-weight:700;font-size:15px;letter-spacing:.06em;
  font-family:"Cinzel",Georgia,serif;text-transform:uppercase;
  transition:opacity .15s,transform .1s,filter .15s;
  position:relative;z-index:1;
}
.btn:active{transform:scale(.98);}
.btn-primary{
  background:linear-gradient(180deg,#d46a32 0%,#a84a1c 45%,#8a3a14 100%);
  color:#f5e6d0;border:1px solid #e08a4a;

  text-shadow:0 1px 2px rgba(0,0,0,.4);
}
.btn-primary:hover{filter:brightness(1.08);}
.btn-primary:disabled{opacity:.45;}
.btn-ghost{background:transparent;color:var(--gold);border:1px solid var(--border);}
.btn-ghost:hover{background:rgba(201,162,39,.08);border-color:var(--gold);}
.btn-danger{background:linear-gradient(180deg,#b33a3a,#7a2222);color:#f5e6d0;border:1px solid #c45c5c;}
.switch-line{text-align:center;margin-top:18px;font-size:14px;color:var(--text-dim);position:relative;z-index:1;}
.switch-line a{color:var(--gold);cursor:pointer;font-weight:700;text-decoration:none;border-bottom:1px solid rgba(201,162,39,.4);}
.switch-line a:hover{color:var(--accent);}
.err-msg{
  background:rgba(155,44,44,.15);color:#e8a0a0;
  border:1px solid rgba(155,44,44,.4);padding:11px 13px;border-radius:8px;
  font-size:13px;margin-bottom:12px;position:relative;z-index:1;
}

.ban-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;}
.ban-card{max-width:380px;background:var(--bg-elev);border:1px solid var(--border);border-radius:14px;padding:24px;box-shadow:var(--shadow);}
.ban-card .icon,.ban-icon{font-size:52px;margin-bottom:12px;}
.ban-card h2{color:var(--red);margin:0 0 8px;font-size:22px;font-family:"Cinzel",Georgia,serif;letter-spacing:.04em;}
.ban-card p{color:var(--text-dim);line-height:1.7;font-size:15px;}
.ban-card .box{background:#0f0c09;border:1px solid var(--border);border-radius:10px;padding:14px;margin:14px 0;text-align:left;}
.ban-card .box div{margin-bottom:6px;font-size:13px;}
.ban-card .box b{color:var(--text);}

.card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.avatar{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#7a3a18);object-fit:cover;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;overflow:hidden;}
.avatar img{width:100%;height:100%;object-fit:cover;}
.avatar.sm{width:34px;height:34px;font-size:13px;}
.avatar.lg{width:84px;height:84px;font-size:28px;}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--leather);color:var(--parchment);padding:11px 18px;border-radius:8px;font-size:13px;z-index:100;box-shadow:var(--shadow);opacity:0;transition:opacity .25s;max-width:90%;text-align:center;pointer-events:none;border:1px solid var(--border);font-family:"Cinzel",Georgia,serif;}
.toast.show{opacity:1;}

.loading-wrap{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;}
.loading-wrap .spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-wrap .loading-text,.loading-wrap .t{color:var(--text-dim);font-size:14px;font-weight:600;font-family:"Cinzel",Georgia,serif;letter-spacing:.1em;}

.verify-wrap{margin:10px 0 3px;position:relative;z-index:1}
.verify-wrap>label{display:block;font-size:11px;color:var(--gold);margin:0 0 5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-family:"Cinzel",Georgia,serif}
.puzzle-wrap{width:100%;user-select:none;-webkit-user-select:none;touch-action:none}
.puzzle-board{position:relative;width:100%;height:118px;border-radius:10px;overflow:hidden;background:#1a140e;border:1px solid var(--border);box-shadow:inset 0 2px 10px rgba(0,0,0,.4);touch-action:none}
.puzzle-board canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.puzzle-target,.puzzle-piece{position:absolute;width:42px;height:42px;border-radius:7px;box-sizing:border-box;pointer-events:auto;clip-path:polygon(0 18%,18% 18%,18% 0,82% 0,82% 18%,100% 18%,100% 82%,82% 82%,82% 100%,18% 100%,18% 82%,0 82%)}
.puzzle-target{border:2px dashed rgba(232,220,200,.7);background:rgba(201,162,39,.12);box-shadow:0 0 0 1px rgba(0,0,0,.22) inset}
.puzzle-piece{z-index:2;border:2px solid var(--gold);box-shadow:0 5px 14px rgba(0,0,0,.5);background-repeat:no-repeat;transform:translate3d(0,0,0);will-change:left,top;cursor:grab;touch-action:none}
.puzzle-piece.dragging{cursor:grabbing;filter:brightness(1.1);box-shadow:0 7px 18px rgba(0,0,0,.55)}
.puzzle-hint{height:19px;line-height:19px;text-align:center;font-size:11px;color:var(--text-dim);overflow:hidden;white-space:nowrap;font-style:italic}
.puzzle-status{height:15px;line-height:15px;text-align:center;font-size:11px;color:var(--text-dim);overflow:hidden}
.puzzle-status.ok{color:var(--green)}
.puzzle-status.bad{color:var(--red)}

body{min-height:100vh;}
.auth-wrap{min-height:100vh;}

/* LIGHT — parchment noon */

</style>

<div id="app">

<script>
const SUPABASE_URL = "https://ihbsxjgzrhnssluqooqh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_hHyHJI5JkxgLNrXAwZrGWQ_vbD3kdrj";
let sb = null;
try {
  if (SUPABASE_URL && !SUPABASE_URL.includes("YOUR-PROJECT") && SUPABASE_URL.length > 8 && SUPABASE_ANON_KEY) {
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
let authMode = 'login';

async function sha256(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
/* ---------- Strong device fingerprint (hard to bypass device ban) ---------- */
function collectDeviceSignals(){
  const nav = navigator || {};
  const scr = window.screen || {};
  const tz = (()=>{ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || ''; }catch(e){ return ''; }})();
  let canvasHash = '';
  try{
    const c = document.createElement('canvas');
    c.width = 200; c.height = 50;
    const ctx = c.getContext('2d');
    if(ctx){
      ctx.textBaseline = 'top';
      ctx.font = '14px Arial';
      ctx.fillStyle = '#f60';
      ctx.fillRect(0,0,200,50);
      ctx.fillStyle = '#069';
      ctx.fillText('Guessino-FP-'+nav.language, 2, 2);
      ctx.fillStyle = 'rgba(102,204,0,0.7)';
      ctx.fillText('fp', 4, 20);
      canvasHash = c.toDataURL().slice(-64);
    }
  }catch(e){}
  return {
    ua: (nav.userAgent || '').slice(0, 300),
    platform: nav.platform || nav.userAgentData?.platform || '',
    language: nav.language || '',
    languages: (nav.languages || []).slice(0,5).join(','),
    screen: (scr.width||0)+'x'+(scr.height||0)+'@'+(window.devicePixelRatio||1),
    colorDepth: scr.colorDepth || 0,
    timezone: tz,
    cores: nav.hardwareConcurrency || 0,
    memory: nav.deviceMemory || 0,
    touch: ('ontouchstart' in window) || (nav.maxTouchPoints > 0),
    maxTouch: nav.maxTouchPoints || 0,
    vendor: nav.vendor || '',
    canvas: canvasHash
  };
}

async function hashFingerprint(str){
  try{
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){
    // fallback simple hash
    let h = 0;
    for(let i=0;i<str.length;i++){ h = ((h<<5)-h)+str.charCodeAt(i); h|=0; }
    return 'fb'+Math.abs(h).toString(16)+str.length.toString(16);
  }
}

async function buildDeviceId(){
  const sig = collectDeviceSignals();
  // stable core signals (changing browser minor version shouldn't always reset)
  const core = [
    sig.platform, sig.language, sig.screen, sig.timezone,
    String(sig.cores), String(sig.memory), String(sig.touch),
    String(sig.maxTouch), sig.vendor, sig.canvas, sig.colorDepth
  ].join('|');
  const fp = await hashFingerprint(core);
  // keep a local seed so even similar phones get unique id when possible
  let seed = null;
  try{ seed = localStorage.getItem('gz_device_seed'); }catch(e){}
  if(!seed){
    seed = (crypto.randomUUID ? crypto.randomUUID() : ('s'+Math.random().toString(36).slice(2)+Date.now()));
    try{ localStorage.setItem('gz_device_seed', seed); }catch(e){}
  }
  const combined = await hashFingerprint(fp + '::' + seed);
  try{ localStorage.setItem('gz_device_id', combined); }catch(e){}
  return { id: combined, signals: sig, coreFp: fp };
}

let DEVICE_INFO = { id: null, signals: {}, coreFp: '' };
let DEVICE_ID = null;

async function initDevice(){
  const built = await buildDeviceId();
  DEVICE_INFO = built;
  DEVICE_ID = built.id;
  return built;
}

function getDeviceId(){
  if(DEVICE_ID) return DEVICE_ID;
  try{
    const cached = localStorage.getItem('gz_device_id');
    if(cached){ DEVICE_ID = cached; return cached; }
  }catch(e){}
  return 'unknown';
}


function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d);
  return dt.toLocaleDateString('en-US') + ' ' + dt.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
}

function validateUsername(u){
  if(u.length < 2 || u.length > 16) return 'Username must be 2-16 characters';
  if(!/^[a-zA-Z0-9_]+$/.test(u)) return 'Only letters, numbers and underscore are allowed';
  return null;
}
function validatePassword(p){
  if(p.length < 3 || p.length > 15) return 'Password must be 3–15 characters';
  return null;
}

function authErrorMessage(error, fallback){
  if(!error) return fallback || 'Something went wrong. Please try again.';
  const code=String(error.code||'');
  const msg=String(error.message||'').toLowerCase();
  if(code==='23505' || msg.includes('duplicate') || msg.includes('unique')) return 'This username is already taken.';
  if(code==='42501' || msg.includes('row-level security') || msg.includes('permission denied')) return 'Database permission denied. Please check the Supabase policies.';
  if(msg.includes('failed to fetch') || msg.includes('network') || msg.includes('fetch')) return 'Connection failed. Check your internet connection and try again.';
  if(msg.includes('timeout')) return 'Server took too long to respond. Please try again.';
  return error.message || fallback || 'Something went wrong. Please try again.';
}

async function withTimeout(promise, ms){
  let timer;
  try{
    return await Promise.race([promise,new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('timeout')),ms)})]);
  }finally{clearTimeout(timer);}
}



async function getActiveDeviceBan(){
  const { data: devBan } = await sb.from('banned_devices').select('*').eq('device_id', DEVICE_ID).maybeSingle();
  if(devBan && (!devBan.banned_until || new Date(devBan.banned_until) > new Date())) return devBan;
  return null;
}

function hideAllScreens(){
  ['loadingScreen','authScreen','banScreen'].forEach(id=>{ const el=$(id); if(el) el.classList.add('hidden'); });
}
function showLoading(){
  hideAllScreens();
  $('loadingScreen').classList.remove('hidden');
}
function showAuth(mode){
  hideAllScreens();
  authMode = mode || 'login';
  $('authScreen').classList.remove('hidden');
  $('authError').classList.add('hidden');
  $('authSubmitBtn').textContent = authMode === 'login' ? 'Log In' : 'Sign Up';
  $('authSub').textContent = authMode === 'login' ? 'Sign in to continue' : 'Create a new account';
  $('authSwitchLine').innerHTML = authMode === 'login'
    ? `Don't have an account? <a href="#" id="authSwitchLink">Sign up</a>`
    : `Already have an account? <a href="#" id="authSwitchLink">Log in</a>`;
  const link = $('authSwitchLink');
  if(link) link.onclick = (e)=>{ e.preventDefault(); showAuth(authMode === 'login' ? 'signup' : 'login'); };
}
function showDeviceBanScreen(devBan){
  hideAllScreens();
  $('banScreen').classList.remove('hidden');
  $('banTypeText').textContent = 'Device ban';
  $('banReasonText').textContent = (devBan && devBan.reason) || 'No reason';
  $('banUntilText').textContent = (devBan && devBan.banned_until) ? fmtDate(devBan.banned_until) : 'Permanent';
}
function showUserBanScreen(user){
  hideAllScreens();
  $('banScreen').classList.remove('hidden');
  $('banTypeText').textContent = (user.ban_type === 'device') ? 'Device ban' : 'Account ban';
  $('banReasonText').textContent = user.ban_reason || 'No reason';
  $('banUntilText').textContent = user.ban_until ? fmtDate(user.ban_until) : 'Permanent';
}
function goHome(){
  try {
    var path = location.pathname || '/';
    if (/\/index\.html$/i.test(path)) path = path.replace(/\/index\.html$/i, '/');
    else if (!path.endsWith('/')) path = path + '/';
    // /REPO/home/login/ → /REPO/home/app/
    path = path.replace(/\/login\/$/, '/');
    location.replace(path + 'app/');
  } catch (e) {
    location.replace('../app/');
  }
}

async function registerCurrentDevice(userId){
  if(!sb || !userId || !DEVICE_ID) return;
  try{
    const { data: existing } = await sb.from('devices').select('id').eq('user_id', userId).eq('device_id', DEVICE_ID).maybeSingle();
    if(existing){
      await sb.from('devices').update({ last_seen: new Date().toISOString(), revoked: false }).eq('id', existing.id);
    } else {
      await sb.from('devices').insert({
        user_id: userId, device_id: DEVICE_ID, last_seen: new Date().toISOString(), revoked: false
      });
    }
  }catch(e){ console.warn(e); }
}

async function finishLogin(user){
  if(user.banned && user.ban_until && new Date(user.ban_until) <= new Date()){
    const { data: updated } = await sb.from('users').update({
      banned:false, ban_type:null, ban_reason:null, ban_until:null, banned_at:null
    }).eq('id', user.id).select().single();
    if(updated) user = updated;
  }
  if(user.banned){ showUserBanScreen(user); return; }
  localStorage.setItem('gz_user_id', user.id);
  await registerCurrentDevice(user.id);
  goHome();
}


/* ---------- Compact drag puzzle CAPTCHA ---------- */
let PUZZLE={x:0,y:0,targetX:0,targetY:0,size:42,drag:false,offX:0,offY:0,solved:false,started:0,moved:0,moveEvents:0,lastX:0,lastY:0,dirChanges:0,lastDir:0};
function puzzleRand(a,b){return Math.floor(Math.random()*(b-a+1))+a}function puzzleStatus(t,c=''){const e=$('puzzleStatus');if(e){e.textContent=t||'';e.className='puzzle-status'+(c?' '+c:'')}}
function puzzleMakeImage(){const b=$('puzzleBoard'),c=$('puzzleCanvas'),p=$('puzzlePiece'),t=$('puzzleTarget');if(!b||!c||!p||!t)return;const w=Math.max(220,b.clientWidth),h=118,s=puzzleRand(38,48);PUZZLE.size=s;c.width=w*2;c.height=h*2;const x=c.getContext('2d');x.setTransform(2,0,0,2,0,0);const palettes=[['#172554','#0f766e','#7c3aed'],['#3f1d2e','#164e63','#854d0e'],['#172033','#3f6212','#7e22ce'],['#1e293b','#075985','#9f1239']];const q=palettes[Math.floor(Math.random()*palettes.length)],g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,q[0]);g.addColorStop(.5,q[1]);g.addColorStop(1,q[2]);x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<45;i++){x.fillStyle='rgba(255,255,255,'+(Math.random()*.07)+')';x.beginPath();x.arc(Math.random()*w,Math.random()*h,2+Math.random()*16,0,Math.PI*2);x.fill()}const minX=8,maxX=Math.max(8,w-s-8),minY=8,maxY=Math.max(8,h-s-8);PUZZLE.targetX=puzzleRand(minX,maxX);PUZZLE.targetY=puzzleRand(minY,maxY);let px=puzzleRand(minX,maxX),py=puzzleRand(minY,maxY);for(let i=0;i<10&&Math.hypot(px-PUZZLE.targetX,py-PUZZLE.targetY)<70;i++){px=puzzleRand(minX,maxX);py=puzzleRand(minY,maxY)}PUZZLE.x=px;PUZZLE.y=py;PUZZLE.solved=false;PUZZLE.drag=false;PUZZLE.started=0;PUZZLE.moved=0;PUZZLE.moveEvents=0;PUZZLE.dirChanges=0;PUZZLE.lastDir=0;PUZZLE.lastX=px;PUZZLE.lastY=py;t.style.left=PUZZLE.targetX+'px';t.style.top=PUZZLE.targetY+'px';const o=document.createElement('canvas');o.width=s;o.height=s;o.getContext('2d').drawImage(c,PUZZLE.targetX*2,PUZZLE.targetY*2,s*2,s*2,0,0,s,s);p.style.width=s+'px';p.style.height=s+'px';p.style.backgroundImage='url('+o.toDataURL('image/png')+')';p.style.top=py+'px';puzzleSetX(px);puzzleStatus('')}
function puzzleSetPos(x,y){const b=$('puzzleBoard'),p=$('puzzlePiece');if(!b||!p)return;const maxX=Math.max(0,b.clientWidth-PUZZLE.size),maxY=Math.max(0,b.clientHeight-PUZZLE.size);PUZZLE.x=Math.max(0,Math.min(maxX,x));PUZZLE.y=Math.max(0,Math.min(maxY,y));p.style.left=PUZZLE.x+'px';p.style.top=PUZZLE.y+'px'}
function puzzleSetX(v){puzzleSetPos(v,PUZZLE.y)}
function puzzleDown(e){const p=$('puzzlePiece');if(!p||PUZZLE.solved)return;const r=p.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)return;e.preventDefault();PUZZLE.drag=true;PUZZLE.started=performance.now();PUZZLE.offX=e.clientX-r.left;PUZZLE.offY=e.clientY-r.top;PUZZLE.moved=0;PUZZLE.moveEvents=0;PUZZLE.dirChanges=0;PUZZLE.lastDir=0;PUZZLE.lastX=PUZZLE.x;PUZZLE.lastY=PUZZLE.y;p.classList.add('dragging');try{p.setPointerCapture(e.pointerId)}catch(_){} }
function puzzleMove(e){if(!PUZZLE.drag)return;e.preventDefault();const r=$('puzzleBoard').getBoundingClientRect(),nx=e.clientX-r.left-PUZZLE.offX,ny=e.clientY-r.top-PUZZLE.offY;const dx=nx-PUZZLE.lastX;PUZZLE.moved+=Math.hypot(nx-PUZZLE.x,ny-PUZZLE.y);PUZZLE.moveEvents++;if(Math.abs(dx)>0.4){const dir=dx>0?1:-1;if(PUZZLE.lastDir&&dir!==PUZZLE.lastDir)PUZZLE.dirChanges++;PUZZLE.lastDir=dir}PUZZLE.lastX=nx;PUZZLE.lastY=ny;puzzleSetPos(nx,ny)}
function puzzleUp(){if(PUZZLE.drag){PUZZLE.drag=false;const p=$('puzzlePiece');if(p)p.classList.remove('dragging')}}
function resetPuzzleCaptcha(){ puzzleMakeImage(); }
function checkPuzzleCaptcha(){if(PUZZLE.solved)return null;if(!PUZZLE.started||PUZZLE.moved<20||PUZZLE.moveEvents<6){puzzleStatus('Drag the piece with your finger.','bad');return 'Please complete the puzzle verification'}const elapsed=performance.now()-PUZZLE.started;if(elapsed<220||elapsed>60000){puzzleStatus('Please move the piece naturally.','bad');resetPuzzleCaptcha();return 'Please try the puzzle again'}const dx=PUZZLE.x-PUZZLE.targetX,dy=PUZZLE.y-PUZZLE.targetY;if(Math.hypot(dx,dy)<=9){PUZZLE.solved=true;puzzleSetPos(PUZZLE.targetX,PUZZLE.targetY);puzzleStatus('Verified ✓','ok');return null}puzzleStatus('Wrong position — try again.','bad');resetPuzzleCaptcha();return 'Puzzle verification failed — try again'}
/* ---------- Anti-bot ---------- */
const AUTH_OPENED_AT = Date.now();
const MIN_FORM_MS = 2500;
const MAX_ACCOUNTS_PER_DEVICE_24H = 2;
const MAX_ACCOUNTS_PER_DEVICE_TOTAL = 4;

async function logAntiBot(action, details){
  if(!sb) return;
  try{
    await sb.from('audit_log').insert({
      actor_id: null,
      actor_username: 'SYSTEM',
      action: action || 'anti_bot',
      target_username: details && details.username || null,
      target_device_id: DEVICE_ID || null,
      details: Object.assign({ source: 'signup' }, details || {})
    });
  }catch(e){ console.warn('anti_bot log', e); }
}

async function deleteUserHard(userId){
  if(!sb || !userId) return;
  try{
    // best-effort cleanup
    await sb.from('devices').delete().eq('user_id', userId);
    await sb.from('users').delete().eq('id', userId);
  }catch(e){ console.warn('delete user', e); }
}

async function countDeviceAccounts(){
  if(!sb || !DEVICE_ID) return { day: 0, total: 0 };
  try{
    const since = new Date(Date.now() - 24*60*60*1000).toISOString();
    const { data: all } = await sb.from('users').select('id,created_at').eq('device_id', DEVICE_ID);
    const rows = all || [];
    const day = rows.filter(u => u.created_at && u.created_at >= since).length;
    return { day, total: rows.length };
  }catch(e){
    return { day: 0, total: 0 };
  }
}

async function runAntiBotGates(username, isSignup){
  // 0) honeypot field — only bots fill hidden inputs
  const hp = $('authWebsite');
  if(hp && hp.value){
    await logAntiBot('anti_bot', { username, reason: 'honeypot_filled' });
    return 'Please try again.';
  }
  // 1) too fast (bot)
  if(Date.now() - AUTH_OPENED_AT < MIN_FORM_MS){
    await logAntiBot('anti_bot', { username, reason: 'form_too_fast', ms: Date.now()-AUTH_OPENED_AT });
    return 'Please wait a moment and try again.';
  }
  // 3) device already banned
  try{
    const ban = await getActiveDeviceBan();
    if(ban){
      return 'This device is restricted.';
    }
  }catch(e){}

  if(isSignup){
    const counts = await countDeviceAccounts();
    if(counts.day >= MAX_ACCOUNTS_PER_DEVICE_24H || counts.total >= MAX_ACCOUNTS_PER_DEVICE_TOTAL){
      await logAntiBot('anti_bot_block_device', {
        username,
        reason: 'mass_signup',
        accounts_24h: counts.day,
        accounts_total: counts.total
      });
      return 'Registration temporarily blocked on this device.';
    }
  }
  return null;
}

async function submitAuth(){
  const username = ($('authUsername').value || '').trim();
  const password = $('authPassword').value || '';
  const errBox = $('authError');
  const btn = $('authSubmitBtn');
  errBox.classList.add('hidden');

  const uErr = validateUsername(username);
  if(uErr){ errBox.textContent=uErr; errBox.classList.remove('hidden'); return; }
  const pErr = validatePassword(password);
  if(pErr){ errBox.textContent=pErr; errBox.classList.remove('hidden'); return; }

  const vErr = checkPuzzleCaptcha();
  if(vErr){ errBox.textContent=vErr; errBox.classList.remove('hidden'); return; }
  if(!sb){ errBox.textContent='Database is not connected. Please check your internet connection.'; errBox.classList.remove('hidden'); return; }

  btn.disabled = true;
  try{
    const botMsg = await withTimeout(runAntiBotGates(username, authMode === 'signup'), 6000);
    if(botMsg){
      errBox.textContent = botMsg;
      errBox.classList.remove('hidden');
      resetPuzzleCaptcha();
      return;
    }

    const hash = await sha256(password);

    if(authMode === 'signup'){
      const lookup = await withTimeout(
        sb.from('users').select('id').ilike('username', username).maybeSingle(), 8000
      );
      if(lookup.error) throw lookup.error;
      if(lookup.data){
        errBox.textContent='This username is already taken.';
        errBox.classList.remove('hidden');
        resetPuzzleCaptcha();
        return;
      }

      const result = await withTimeout(sb.from('users').insert({
        username: username,
        password_hash: hash,
        device_id: DEVICE_ID
      }).select().single(), 10000);
      if(result.error) throw result.error;
      const newUser=result.data;

      const counts = await withTimeout(countDeviceAccounts(), 6000);
      if(counts.day > MAX_ACCOUNTS_PER_DEVICE_24H || counts.total > MAX_ACCOUNTS_PER_DEVICE_TOTAL){
        await deleteUserHard(newUser.id);
        await logAntiBot('anti_bot_delete_user', {username,reason:'post_signup_limit',target_user_id:newUser.id,accounts_24h:counts.day,accounts_total:counts.total});
        errBox.textContent='Registration blocked on this device.';
        errBox.classList.remove('hidden');
        resetPuzzleCaptcha();
        return;
      }

      await logAntiBot('signup', {username,user_id:newUser.id,note:'ok'});
      await finishLogin(newUser);
    }else{
      const result = await withTimeout(
        sb.from('users').select('*').ilike('username', username).maybeSingle(), 8000
      );
      if(result.error) throw result.error;
      const user=result.data;
      if(!user){
        errBox.textContent='Username not found.';
        errBox.classList.remove('hidden');
        resetPuzzleCaptcha();
        return;
      }
      if(user.password_hash !== hash){
        errBox.textContent='Incorrect password.';
        errBox.classList.remove('hidden');
        resetPuzzleCaptcha();
        return;
      }
      await finishLogin(user);
    }
  }catch(e){
    console.error('Authentication error:',e);
    errBox.textContent=authErrorMessage(e,'Unable to complete the request. Please try again.');
    errBox.classList.remove('hidden');
    resetPuzzleCaptcha();
  }finally{
    btn.disabled=false;
  }
}

$('authSubmitBtn').onclick = ()=> submitAuth();
['authUsername','authPassword'].forEach(id=>{
  const el=$(id); if(el) el.addEventListener('keydown', e=>{ if(e.key==='Enter') submitAuth(); });
});
$('banLogoutBtn').onclick = ()=>{ localStorage.removeItem('gz_user_id'); showAuth('login'); };

async function boot(){
  showLoading();
  let finished=false;
  const forceOpen=setTimeout(()=>{
    if(!finished){
      finished=true;
      showAuth('login');
      const e=$('authError');
      e.textContent='Connection is taking too long. You can try logging in again.';
      e.classList.remove('hidden');
    }
  },4500);

  try{
    if(!sb){
      finished=true;
      showAuth('login');
      $('authError').textContent='Database is not connected. Please check your connection.';
      $('authError').classList.remove('hidden');
      return;
    }

    try{ await withTimeout(initDevice(),1800); }
    catch(e){
      console.warn('Device initialization failed:',e);
      DEVICE_ID=getDeviceId();
    }

    try{
      const devBan=await withTimeout(getActiveDeviceBan(),2500);
      if(devBan){ finished=true; showDeviceBanScreen(devBan); return; }
    }catch(e){ console.warn('Device ban check skipped:',e); }

    const savedId=localStorage.getItem('gz_user_id');
    if(savedId){
      try{
        const result=await withTimeout(sb.from('users').select('*').eq('id',savedId).maybeSingle(),2500);
        if(!result.error && result.data){
          finished=true;
          if(result.data.banned){ showUserBanScreen(result.data); return; }
          goHome();
          return;
        }
      }catch(e){ console.warn('Saved session check failed:',e); }
      localStorage.removeItem('gz_user_id');
    }

    finished=true;
    showAuth('login');
  }catch(e){
    console.error('Boot error:',e);
    localStorage.removeItem('gz_user_id');
    finished=true;
    showAuth('login');
  }finally{
    clearTimeout(forceOpen);
  }
}

(function bindPuzzleUI(){const p=$('puzzlePiece');if(p&&!p._bound){p._bound=true;p.addEventListener('pointerdown',puzzleDown,{passive:false});p.addEventListener('pointermove',puzzleMove,{passive:false});p.addEventListener('pointerup',puzzleUp,{passive:false});p.addEventListener('pointercancel',puzzleUp,{passive:false})}window.addEventListener('resize',()=>{if($('puzzleCaptcha')&&!$('authScreen').classList.contains('hidden'))puzzleMakeImage()});requestAnimationFrame(()=>requestAnimationFrame(()=>{if($('puzzleCaptcha'))puzzleMakeImage()}))})();

boot();
